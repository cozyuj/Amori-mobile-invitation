apiVersion: apps/v1
kind: Deployment
metadata:
  name: amori-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amori-backend
  template:
    metadata:
      labels:
        app: amori-backend
    spec:
      # DNS 설정 추가
      dnsPolicy: ClusterFirst
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4
        options:
          - name: ndots
            value: "2"
          - name: timeout
            value: "3"
          - name: attempts
            value: "3"
      imagePullSecrets:
      - name: gcr-key 
      containers:
      - name: amori-backend-container
        image: us-central1-docker.pkg.dev/amori-476504/amori-docker-images/amori-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: db-host
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: db-password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: db-name
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: jwt-secret-key
        - name: JWT_ALGORITHM
          value: "HS256"
        - name: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
          value: "1440"
        - name: GCS_BUCKET_NAME
          value: "amori-photos"
        - name: FRONTEND_URL
          value: "https://amori.co.kr"
        - name: NAVER_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: naver-oauth-secret
              key: NAVER_CLIENT_ID
        - name: NAVER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: naver-oauth-secret
              key: NAVER_CLIENT_SECRET
        - name: NAVER_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: naver-oauth-secret
              key: NAVER_REDIRECT_URI
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google-oauth-secret
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: google-oauth-secret
              key: GOOGLE_CLIENT_SECRET
        - name: GOOGLE_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: google-oauth-secret
              key: GOOGLE_REDIRECT_URI
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: amori-secrets
              key: google-maps-api-key
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /  
            port: 8080 
          initialDelaySeconds: 60 
          periodSeconds: 10     
          timeoutSeconds: 5
          failureThreshold: 3       
        
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 5